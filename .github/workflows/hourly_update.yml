name: Hourly Data Update

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  push:
    branches: [main]  # Deploy site immediately on a push (no data re-fetch)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    # Skip the fetch/predict pipeline on plain pushes — those only deploy the
    # current site. Data refresh runs on the cron schedule and manual dispatch.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lightgbm scikit-learn holidays

      - name: Fetch ferry data
        run: python scripts/fetch_ferry_data.py

      - name: Fetch weather data
        run: python scripts/fetch_weather.py

      - name: Aggregate to daily and hourly
        run: python scripts/aggregate_daily.py

      - name: Generate next-day prediction
        run: python scripts/predict_tomorrow.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet outputs/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add outputs/
          git commit -m "Hourly data update - $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changes != 'true'
        run: echo "No new data to commit"

  deploy-pages:
    runs-on: ubuntu-latest
    needs: update-data
    # Deploy when the data job succeeded (cron/dispatch) OR was skipped (push).
    # Skip only if the data job actually failed or was cancelled.
    if: always() && needs.update-data.result != 'failure' && needs.update-data.result != 'cancelled'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    runs-on: ubuntu-latest
    needs: update-data
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Hourly update failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `The hourly data update workflow failed.\n\n` +
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please check the logs and fix the issue.`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['workflow-failure']
              });
            }
